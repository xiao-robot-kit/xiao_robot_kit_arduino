sentence=POSIX-style C core for small robots: IMU driver, attitude fusion and motor control, with a thin Arduino glue layer.
paragraph=LSM6DS3TR-C six-axis IMU driver over Wire I2C, quaternion plus Mahony attitude fusion, PWM timer with PID speed loop and seven-phase S-curve trajectory for motors, all parameters from named preset tables (zero hardcoded parameters). Pure C core; platform buses are injected as function pointer tables, Arduino adapters included.
